// Get tipo procedimiento transformed value
function getTipoProcedimiento(tipoRaw, poblacionNorm) {
  const t = String(tipoRaw || "").trim().toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  if (t.includes("MONITORIO")) return "MONITORIO #MON#";
  if (t.includes("ORDINARIO")) return "PROCEDIMIENTO ORDINARIO #ORD#";
  if (t.includes("VERBAL")) {
    const key = String(poblacionNorm || "").toUpperCase().trim().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ");
    return PARTIDO_VERBAL[key] || "JUICIO VERBAL #VRB#";
  }
  return tipoRaw || "";
}
function normalize(str) {
  return String(str || "").toUpperCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ");
}

// Auto-detect which column contains full addresses (prefer columns with CP 5-digit blocks)
function detectAddressColumn(headers, sampleRows) {
  // First try known address column names
  const knownAddr = headers.find(h => h && (h.toLowerCase().includes("address") || h.toLowerCase().includes("direcc") || h.toLowerCase().includes("legal addr") || h.toLowerCase().includes("mailing")));
  if (knownAddr) return knownAddr;

  // Exclude columns that are clearly not addresses
  const excluded = new Set(["Whole Case Number", "Original Contract Number", "EXP KMALEON", "NIG", "Client Name", "Client ID", "Client ID 1", "Client's ID", "Client's Name", "PROCURADOR", "PROCURADOR ", "Portfolio", "Name of Portfolio", "AMOUNT", "Amount for execution", "Tipo de Procedimiento", "tipo procedimiento", "JUZGADO", "Court", "CITY COURT", "City Court", "AUTOS", "autos"]);
  const scores = {};
  headers.forEach(h => {
    if (!h || excluded.has(h)) return;
    let score = 0;
    sampleRows.slice(0, 10).forEach(r => {
      const val = String(r[h] || "");
      if (val === "#N/D" || val === "" || val === "0") {
        score -= 10;
        return;
      }
      if (val.match(/\b\d{5}\b/)) score += 10;
      if (val.match(/calle|avenida|plaza|paseo|cami|carrer|rua|via|camino|aldea|barrio|pol[ií]gono/i)) score += 5;
      if (val.match(/,/)) score += 2;
      if (val.match(/\d/)) score += 1;
      if (val.length > 15 && val.length < 120) score += 2;
    });
    scores[h] = score;
  });
  const best = headers.filter(h => h && !excluded.has(h)).reduce((best, h) => !best || (scores[h] || 0) > (scores[best] || 0) ? h : best, null);
  return (scores[best] || 0) > 0 ? best : null;
}

// Auto-detect the name column
function detectNameColumn(headers, sampleRows) {
  // Look for columns where values look like person names (2-5 words, no numbers)
  const scores = {};
  headers.forEach(h => {
    if (!h) return;
    let score = 0;
    sampleRows.slice(0, 10).forEach(r => {
      const val = String(r[h] || "");
      const words = val.trim().split(/\s+/);
      if (words.length >= 2 && words.length <= 6 && !val.match(/\d/) && val.length > 5) score += 3;
    });
    scores[h] = score;
  });
  // Prefer known column names first
  const known = headers.find(h => h === "Client Name 1" || h === "Client's Name" || h?.toLowerCase().includes("client") && h?.toLowerCase().includes("name"));
  if (known) return known;
  return headers.reduce((best, h) => !best || (scores[h] || 0) > (scores[best] || 0) ? h : best, null);
}

// Format CP as 5-digit zero-padded string
function formatCP(cp) {
  if (!cp && cp !== 0) return "";
  const s = String(cp).trim().replace(/\.0$/, ""); // remove .0 from numeric reads
  return s.padStart(5, "0");
}

// Check if address is empty or invalid
function isEmptyAddress(val) {
  const s = String(val || "").trim();
  return s === "" || s === "#N/D" || s === "N/D" || s === "#N/A" || s === "0";
}
function validateNombre(original, formateado) {
  if (!original || !formateado) return true;
  const norm = s => s.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
  const originalWords = new Set(norm(original));
  const formateadoWords = norm(formateado.replace(/,/g, " "));
  return formateadoWords.filter(w => !originalWords.has(w)).length === 0;
}

// Cross-reference City Court against the embedded dictionary
// Returns { nombrePartido, tipoJuzgado, found } — found=false means no match
function lookupPartido(ciudadRaw) {
  const key = normalize(ciudadRaw);
  if (!key) return {
    nombrePartido: "",
    tipoJuzgado: "",
    found: false
  };
  // Exact match
  if (DICCIONARIO_PARTIDOS[key]) return {
    ...DICCIONARIO_PARTIDOS[key],
    found: true
  };
  // Partial match
  const keys = Object.keys(DICCIONARIO_PARTIDOS);
  const partial = keys.find(k => k === key || k.includes(key) || key.includes(k));
  if (partial) return {
    ...DICCIONARIO_PARTIDOS[partial],
    found: true
  };
  // No match — return empty, not the raw value
  return {
    nombrePartido: "",
    tipoJuzgado: "",
    found: false
  };
}
function parseSharePointFile(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, {
    type: "array"
  });
  const sheetName = "SCP - PLAZAS";
  if (!wb.SheetNames.includes(sheetName)) {
    throw new Error(`Hoja "${sheetName}" no encontrada. Hojas disponibles: ${wb.SheetNames.join(", ")}`);
  }
  const ws = wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(ws, {
    header: 1
  });
  const dict = {};
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    const colB = String(row[1] || "").trim();
    const colD = String(row[3] || "").trim();
    const colE = String(row[4] || "").trim();
    if (colB) dict[normalize(colB)] = {
      colaborador: colD,
      colaboradorPuntual: colE
    };
  }
  return dict;
}

// Extract autos number - format XXXX/AAAA
function extractAutos(row, autosCol) {
  // Try exact column name first, then fallback names
  const val = row[autosCol] ?? row["autos"] ?? row["Autos"] ?? row["AUTOS"] ?? "";
  return String(val).trim();
}

// Auto-detect autos column
function detectAutosColumn(headers, sampleRows) {
  const known = headers.find(h => h && h.toLowerCase().trim() === "autos");
  if (known) return known;
  // Fallback: find column where values match XXXX/YYYY pattern
  return headers.find(h => {
    if (!h) return false;
    return sampleRows.slice(0, 5).some(r => String(r[h] || "").match(/\d{1,5}\/\d{4}/));
  }) || "";
}

// Extract court number from "Court" column
// Format: "SECCIÓN CIVIL  1  SANTA COLOMA GRAMENET  (0853)" → "1"
function extractCourtNumber(courtStr) {
  if (!courtStr) return "";
  const s = String(courtStr).normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const match = s.match(/CIVIL\s+(\d+)/i);
  return match ? match[1] : "";
}

// ── NOMBRE: reglas programadas (sin IA) ──────────────────────────────────────
function formatearNombre(nombre) {
  if (!nombre) return "";
  const original = String(nombre).trim();
  const upper = original.toUpperCase().replace(/\s+/g, " ");
  const partes = upper.split(" ");
  if (partes.length === 0) return upper;
  if (partes.length === 1) return upper;

  // Partículas que NO son nombre propio
  const particulas = new Set(["DE", "DEL", "DE LA", "DE LOS", "DE LAS", "LA", "LOS", "LAS", "Y", "I", "VAN", "VON", "LE", "LES"]);

  // Agrupar tokens respetando partículas
  const tokens = [];
  let i = 0;
  while (i < partes.length) {
    // Intenta agrupar partícula + siguiente(s)
    let grupo = partes[i];
    if (i + 1 < partes.length && particulas.has(partes[i])) {
      // Partícula sola: forma parte del grupo siguiente
      grupo = partes[i] + " " + partes[i + 1];
      i += 2;
      // ¿Otro artículo seguido? ej "DE LA"
      if (i < partes.length && particulas.has(partes[i])) {
        grupo += " " + partes[i] + " " + (partes[i + 1] || "");
        i += 2;
      }
    } else {
      i++;
    }
    if (grupo.trim()) tokens.push(grupo.trim());
  }
  if (tokens.length === 1) return tokens[0];
  if (tokens.length === 2) return tokens[1] + ", " + tokens[0];
  // 3 tokens: primero=nombre, resto=apellidos
  if (tokens.length === 3) return tokens[1] + " " + tokens[2] + ", " + tokens[0];
  // 4+ tokens: últimos 2 = apellidos, resto = nombre
  const apellidos = tokens.slice(tokens.length - 2).join(" ");
  const nombreParte = tokens.slice(0, tokens.length - 2).join(" ");
  return apellidos + ", " + nombreParte;
}

const PALABRAS_EXCLUIR = /^(PTA|DCHA|IZQ|BJS|BAJO|BAJOS|EDIF|EDIFICIO|BLOQUE|BLQ|APTO|PLTA|PTAL|PIS|ESC|ESCALERA|INT|EXT|LOCAL|LOC|PORTAL|PTL|LETRA|DR|DPL|DUPLEX|ÁTICO|ATICO|ENTREPLANTA|ENTLO|ENTPLO|SEMISOTANO|SEMIS|D|I|B|C|F)$/;

      cp,
      ciudad

    const nums = resto.split(/[,\s]+/).filter(t => {

      if (PALABRAS_EXCLUIR.test(t)) return false;
      if (/^[A-Z]$/.test(t)) return false;
      return false;

      cp,
      ciudad

    // Buscar primer bloque numérico que sigue al nombre de calle
    const catMatch = sinCpCiudad.match(/^(.*?)\s+(\d+)\b(.*)$/);
    if (!catMatch) return {
      calle: sinCpCiudad,
      cp,
      ciudad
    };
    const nombreCalle = catMatch[1].trim();
    const primerNum = catMatch[2];
    const restoLiteral = (catMatch[3] || "").trim().replace(/^[,\s]+/, "").trim();
    let calle = nombreCalle + ", " + primerNum;
    if (restoLiteral) calle += ", " + restoLiteral;
    return {
      calle,
      cp,
      ciudad
    };
  }
}
